# Cargo.toml = la « fiche d'identité » du programme Rust.
# Cargo (le gestionnaire de projets Rust) lit ce fichier pour savoir
# comment compiler le programme et quelles bibliothèques (« crates ») télécharger.

[package]
name = "dofus-team-manager"
version = "0.3.0"
description = "Gestionnaire d'équipe multicompte pour Dofus : navigation entre fenêtres et invitations de groupe"
authors = ["Contributeurs de Dofus Team Manager"]
edition = "2021"
# Version minimale de Rust : le code utilise `&raw mut` (Rust 1.82).
rust-version = "1.82"

[lib]
# Le code de l'application est compilé comme une bibliothèque (lib.rs),
# que le petit main.rs se contente d'appeler.
# Le suffixe `_lib` évite un conflit de nom avec l'exécutable sous Windows,
# voir https://github.com/rust-lang/cargo/issues/8519
name = "dofus_team_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Utilisé uniquement pendant la compilation (par build.rs).
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri : le framework qui affiche notre interface web dans une fenêtre native
# et permet au JavaScript d'appeler des fonctions Rust.
# `tray-icon` : l'icône dans la zone de notification (près de l'horloge).
tauri = { version = "2", features = ["tray-icon"] }
# serde : transforme nos structures Rust en JSON et inversement
# (pour le fichier de configuration et pour discuter avec l'interface).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# La crate `windows` donne accès à l'API Win32, c'est-à-dire aux fonctions
# du système Windows (lister les fenêtres, les mettre au premier plan...).
# Elle est découpée en « features » : on n'active que les morceaux utilisés,
# ce qui accélère la compilation. L'application ne vise que Windows.
windows = { version = "0.61", features = [
  "Win32_Foundation",                 # types de base : HWND, BOOL, HANDLE...
  "Win32_UI_WindowsAndMessaging",     # EnumWindows, SetForegroundWindow...
  "Win32_System_Threading",           # OpenProcess, nom de l'exécutable d'un processus
  "Win32_System_LibraryLoader",       # GetModuleHandleW (pour installer le crochet clavier)
  "Win32_System_DataExchange",        # presse-papiers (OpenClipboard, SetClipboardData...)
  "Win32_System_Memory",              # GlobalAlloc (mémoire confiée au presse-papiers)
  "Win32_System_Ole",                 # CF_UNICODETEXT (format « texte » du presse-papiers)
  "Win32_UI_Input_KeyboardAndMouse",  # SendInput, RegisterHotKey, état des touches
  "Win32_UI_Accessibility",           # SetWinEventHook (être prévenu des changements de premier plan)
  "Win32_UI_Shell",                   # ITaskbarList (ordre des boutons de la barre des tâches)
  "Win32_System_Com",                 # CoCreateInstance (pour obtenir ITaskbarList)
  "Win32_System_SystemInformation",   # GetLocalTime (date et heure du journal des problèmes)
] }
# Plugin officiel de mise à jour automatique (voir updater.rs).
tauri-plugin-updater = "2"
# Plugin officiel « instance unique » : relancer l'application réaffiche
# celle qui tourne déjà au lieu d'en démarrer une deuxième.
tauri-plugin-single-instance = "2"

# Réglages de la version finale (`npm run tauri build`) : un exécutable plus
# petit et plus rapide, au prix d'une compilation plus longue.
[profile.release]
opt-level = "s"     # optimiser pour la taille
lto = true          # optimisation sur l'ensemble du programme
codegen-units = 1   # compilation en un seul bloc : plus lente, mais meilleur résultat
strip = true        # retirer les informations de débogage de l'exécutable
