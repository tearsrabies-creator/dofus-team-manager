<!doctype html>
<!--
  Le bandeau (« pip », pour picture-in-picture) : une petite fenêtre sans
  bordure, toujours au-dessus des autres. Sa logique est dans src/pip.ts.
  Elle est « non activable » ("focusable": false dans tauri.conf.json) : un
  clic agit tout de suite, sans lui donner le focus ; le jeu garde donc le
  focus et deux clics rapides sur deux pseudos marchent tous les deux.
-->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dofus Team Manager — bandeau</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/pip.ts" defer></script>
  </head>

  <body>
    <!-- `data-tauri-drag-region="deep"` : on déplace le bandeau en le
         saisissant n'importe où sauf sur un bouton ; la poignée ⠿ est la
         prise la plus visible. -->
    <div id="root" class="pip" data-tauri-drag-region="deep">
      <span class="grip" title="Déplacer le bandeau">⠿</span>
      <div id="characters" class="characters"></div>
      <button id="invite-button" class="small" type="button">👥</button>
      <button
        id="reorder-button"
        class="small"
        type="button"
        title="Ranger les fenêtres Dofus de la barre des tâches dans l'ordre de la liste"
        aria-label="Ranger la barre des tâches"
      >
        🔃
      </button>
      <button id="pause-button" class="small" type="button">⏸</button>
      <button
        id="restore-button"
        class="small"
        type="button"
        title="Afficher l'application"
        aria-label="Afficher l'application"
      >
        ⤢
      </button>
    </div>
  </body>
</html>
